# Genaro 1.7B: full fine-tune of Qwen3-1.7B (Apache 2.0) on PokerSI's exact prompts.
# ~1.1 GB as Q4_K_M: for 6 GB+ phones; stronger play.

model:
  name: Qwen/Qwen3-1.7B
  # FlashAttention 2 for sm_121 from the Hub (`kernels`), needed for padding_free
  attn: kernels-community/flash-attn2

data:
  path: sft-qwen3-solver  # make solve relabel-talk sft-data  (solver labels)
  n_eval: 256

train:
  output_dir: runs/genaro-1.7b
  num_train_epochs: 2
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 2      # effective batch 64
  padding_free: true                  # no pad tokens: rows are packed per batch for FA2 (+29% on 0.6B, +18% on 1.7B)
  train_sampling_strategy: group_by_length
  learning_rate: 3.0e-5               # full fine-tune: ~10x lower than LoRA
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: false       # tiny model, lots of memory
  use_liger_kernel: true
  max_length: null                    # rows are <= 832 tokens; padding_free needs it unset
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  report_to: tensorboard
  dataloader_num_workers: 4
  seed: 42
