# Genaro 0.6B + DAgger: full fine-tune of Qwen3-0.6B (Apache 2.0) on PokerSI's exact prompts.
# ~480 MB as Q4_K_M: fast on any phone that runs PokerSI.

model:
  name: Qwen/Qwen3-0.6B

data:
  path: sft-qwen3-solver-dagger  # + DAgger states (make dagger)
  n_eval: 256

train:
  output_dir: runs/genaro-0.6b-dagger
  num_train_epochs: 2
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4      # effective batch 64
  train_sampling_strategy: group_by_length
  learning_rate: 3.0e-5               # full fine-tune: ~10x lower than LoRA
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: false       # tiny model, lots of memory
  use_liger_kernel: true
  max_length: 2048
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  report_to: tensorboard
  dataloader_num_workers: 4
  seed: 42
