[project]
name = "genaro-poker"
version = "0.1.0"
description = "Genaro: a phone-sized poker LLM fine-tuned for PokerSI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.15",
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "trl",
    "safetensors",
    "pyyaml",
    "rich",
    "tensorboard",
    "liger-kernel",
    "bitsandbytes",
    "kernels>=0.18.0",
    "nvidia-ml-py>=13.615.71",
    "sentencepiece>=0.2.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu134" }]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true
